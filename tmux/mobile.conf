# The mobile page's buttons (mobile/page.js). Each sends one of these sequences, which no
# keyboard produces, as terminal input; tmux treats it as a key press by that page's client, so it acts
# on the window that client shows, as Ctrl+Q does (tmux/pi-tabs.conf). scripts/mobile-terminal.sh
# sources this before each connection attaches. Fixed indexes keep re-sourcing idempotent.

set -gF @pi_mobile_sidebar "#{d:current_file}/../scripts/tmux-sidebar.sh"
set -s user-keys[901] "\e[9001~"
set -s user-keys[902] "\e[9002~"
set -s user-keys[903] "\e[9003~"
# Not -b: presses in quick succession run in turn, each starting from the width the last one left.
bind-key -n User901 run-shell "sh '#{@pi_mobile_sidebar}' '#{window_id}'"
bind-key -n User902 run-shell "sh '#{@pi_mobile_sidebar}' '#{window_id}' narrower"
bind-key -n User903 run-shell "sh '#{@pi_mobile_sidebar}' '#{window_id}' wider"

# Sessions, Agent, Preview: make that pane of the window the active one, keeping Focus.
set -gF @pi_mobile_select "#{d:current_file}/../scripts/tmux-mobile-select.sh"
set -s user-keys[908] "\e[9008~"
set -s user-keys[909] "\e[9009~"
set -s user-keys[910] "\e[9010~"
bind-key -n User908 run-shell "sh '#{@pi_mobile_select}' '#{window_id}' '#{client_name}' sessions"
bind-key -n User909 run-shell "sh '#{@pi_mobile_select}' '#{window_id}' '#{client_name}' agent"
bind-key -n User910 run-shell "sh '#{@pi_mobile_select}' '#{window_id}' '#{client_name}' preview"

# Focus: shows only the active pane (tmux zoom), or every pane again.
set -s user-keys[907] "\e[9007~"
bind-key -n User907 resize-pane -Z

# Edit, Esc and Save: typed into the active pane only when it is the Markdown editor (the pane option
# set by scripts/lib/diff-pane.ts startEditor), so they never reach Pi. Ctrl-\ Ctrl-N returns Neovim
# to Normal mode from any mode, without Escape's wait for a following key; then i starts typing and w
# is the editor's save key (nvim/pi-markdown/init.lua).
set -s user-keys[904] "\e[9004~"
set -s user-keys[905] "\e[9005~"
set -s user-keys[906] "\e[9006~"
bind-key -n User904 if-shell -F "#{@pi_doc_server}" { send-keys 'C-\' C-n i } { display-message "Tap the Markdown editor pane first" }
bind-key -n User905 if-shell -F "#{@pi_doc_server}" { send-keys 'C-\' C-n } { display-message "Tap the Markdown editor pane first" }
bind-key -n User906 if-shell -F "#{@pi_doc_server}" { send-keys 'C-\' C-n w } { display-message "Tap the Markdown editor pane first" }
