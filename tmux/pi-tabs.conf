# Two labelled tab rows at the bottom: Windows (this session's windows) and Panels (the previews of
# the Pi in the current window). Click a tab to show it; click its × to close it. Source from
# ~/.tmux.conf with this file's path; it finds its helper relative to itself.

set -gF @pi_tabs "#{d:current_file}/../scripts/tmux-tabs.mjs"
set -g mouse on
set -g status 2

# Windows: waiting previews are left out (they are Panels tabs); π marks a window running Pi.
set -g status-left "Windows "
set -g status-left-length 10
set -g window-status-separator ""
set -g window-status-format "#{?@pi_preview_window,,#I:#{?@pi_window,π ,}#W#{?window_flags,#{window_flags},} #[range=user|w#{window_id}]×#[norange]  }"
set -g window-status-current-format "#{?@pi_preview_window,,#[reverse]#I:#{?@pi_window,π ,}#W#{?window_flags,#{window_flags},}#[noreverse] #[range=user|w#{window_id}]×#[norange]  }"

# Panels: written by the Pi extension for its window and its waiting-preview windows.
set -g status-format[1] "#[align=left]Panels  #{@pi_panels}"

# Our tab and × ranges go to the helper; any other status click keeps tmux's default.
bind -n MouseDown1Status if -F "#{m/r:^([pd][sx]%|w@),#{mouse_status_range}}" {
  run-shell -b "node --no-warnings '#{@pi_tabs}' '#{mouse_status_range}' '#{client_name}'"
} {
  switch-client -t =
}

# Previews whose Pi went without quitting stay for a resume of its session, shown as ordinary windows
# (releaseOrphans in scripts/lib/diff-pane.ts). A pane closes when its program exits, by kill-pane (ccmux,
# the × tabs), or with its window or session.
set-hook -g pane-exited[71] { run-shell -b "node --no-warnings '#{@pi_tabs}' sweep" }
set-hook -g after-kill-pane[71] { run-shell -b "node --no-warnings '#{@pi_tabs}' sweep" }
set-hook -g window-unlinked[71] { run-shell -b "node --no-warnings '#{@pi_tabs}' sweep" }

# Each terminal its own view: a client that attaches to, or switches into, a session another client
# is showing gets a grouped session (the same windows, its own current window), so a monitor and the
# laptop screen can show different windows. Fixed indexes keep re-sourcing idempotent.
set -gF @pi_view "#{d:current_file}/../scripts/tmux-view.sh"
set-hook -g client-attached[70] { run-shell -b "sh '#{@pi_view}' '#{client_name}'" }
set-hook -g client-session-changed[70] { run-shell -b "sh '#{@pi_view}' '#{client_name}'" }

# Size each window by the terminals showing it (aggressive-resize), and when two screens show the same
# window, by the one used last (latest), so the screen in use is filled rather than edged with dots.
# tmux handles a click against the layout before resizing, so a first click on the other screen could
# land in the wrong pane; focus events make moving to that screen resize the window before any click.
set -g window-size latest
setw -g aggressive-resize on
set -s focus-events on

# Ctrl+Q opens or closes the ccmux sidebar in this window only (ccmux's own toggle acts on every
# window, so with a view per terminal it changed both screens). Replaces the ccmux binding.
set -gF @pi_sidebar "#{d:current_file}/../scripts/tmux-sidebar.sh"
bind-key -n C-q run-shell -b "sh '#{@pi_sidebar}' '#{window_id}'"
